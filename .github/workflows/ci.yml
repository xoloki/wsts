on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - '**'

permissions:
  contents: read

name: CI

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Set explicitly rather than inherited: v1 defaulted rustflags to
          # "-D warnings", v2 defaults it to "" and denies via
          # CARGO_BUILD_WARNINGS instead, which needs Cargo >= 1.91. Pinning
          # the mechanism keeps the gate identical across action versions.
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Cargo Check
        id: cargo_check
        run: |
          cargo check --locked

  test-all:
    name: test-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Cargo Test
        id: cargo_test
        run: |
          cargo test --locked
          cargo test --locked --features with_v1

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Cargo Fmt
        id: cargo_fmt
        run: |
          cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Cargo Clippy
        id: cargo_clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""

      # Exercises the same packaging and verify-build that `cargo publish`
      # performs, without needing the crates.io environment or a token. This
      # is where mistakes in required-features, [[bin]] targets or `exclude`
      # surface, so it gates every PR rather than waiting for a release tag.
      - name: Cargo Publish Dry Run
        id: cargo_publish_dry_run
        run: |
          cargo publish --dry-run --locked

  doc:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""

      - name: Install LaTeX
        id: install_latex
        run: ./.doc/install-latex-ubuntu.sh

      - name: Build Website
        id: build_website
        run: ./.doc/build.sh

      - name: Upload PDF
        id: upload_pdf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsts.pdf
          path: wsts.pdf

      - name: Upload Website
        id: upload_website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: ./target/doc/

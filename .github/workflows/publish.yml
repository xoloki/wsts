name: Cargo Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # Lets the publish path be exercised without a tag, so that a release tag is
  # not simultaneously this workflow's first execution and a real upload. A
  # dispatch with dry_run left at true covers checkout, toolchain install, the
  # environment approval gate and packaging, and mints no credential at all.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only; do not upload to crates.io"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      # Required to mint the OIDC token that crates.io trusted publishing
      # exchanges for a short-lived registry token. Scoped to this job.
      id-token: write
    steps:
      - name: Checkout Repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: "-D warnings"
          build-warnings: ""

      # Always runs, including on a real release, so a packaging failure stops
      # the job before anything is uploaded.
      - name: Cargo Publish Dry Run
        id: cargo_publish_dry_run
        run: |
          cargo publish --dry-run --locked

      # Trusted publishing: GitHub mints an OIDC token asserting this repo,
      # this workflow file and this environment; crates.io exchanges it for a
      # short-lived registry token, which the action's post step revokes when
      # the job ends. There is no long-lived publish credential to store, leak
      # or inherit.
      #
      # NOTE: the crates.io trusted publisher record names this file. Renaming
      # publish.yml breaks publishing until that record is updated.
      #
      # Gated identically to the publish step below, so a dry run never
      # requests a token.
      - name: Authenticate with crates.io
        id: auth
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Cargo Publish
        id: cargo_publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked
